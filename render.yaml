services:
  - type: web
    name: agent-office
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node packages/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # Set this in the Render dashboard (Environment) to give the agents brains:
      # - key: OPENROUTER_API_KEY
      #   value: sk-or-v1-xxxx  (from https://openrouter.ai/keys)
      # Private office password (the browser deploy sets this):
      - key: OFFICE_PASSWORD
        value: harbor-boss-808
